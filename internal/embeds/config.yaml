presets:
  common:
    description: "常见的清理文档"
    stored:
    remove:
      # 图片格式（原有+补充）
      - jpg
      - jpeg
      - png
      - bmp
      - ico
      - gif
      - tiff
      - webp
      - svg
      - heic
      # 样式/字体（原有+补充）
      - css
      - scss
      - less
      - woff
      - woff2
      - ttf
      - otf
      - eot
      # 音视频（原有+补充）
      - mp3
      - mp4
      - avi
      - mov
      - flv
      - wmv
      - mkv
      - wav
      - aac
      - ogg
      # 压缩包（原有+补充）
      - zip
      - tar
      - tar.gz
      - gz
      - bz2
      - 7z
      - rar
      - iso
      - dmg
      # 编译/构建产物
      - a
      - lib
      - obj
      - pyc
      - pyo
      - pyd
      - o
      - out
      - bin
      # 日志文件
      - txt.log
      - log.txt
      - debug
      - error
      # 缓存/临时文件
      - cache
      - temp
      - tmp
      - backup
      - old
      # 其他冗余文件
      - csv
      - xlsx
      - xls
      - docx
      - doc
      - pptx
      - ppt
      - pdf
      - db
      - sqlite
      - lock
      - pid
    rmdirs:
      # 版本控制/构建目录
      - ".git"
      - ".svn"
      - ".hg"
      - ".bzr"
      - "node_modules"
      - "out"
      - "bin"
      - "obj"
      # 缓存目录
      - ".cache"
      - ".temp"
      - "tmp"
      - "temp"
      # 依赖管理目录
      - "vendor"
      - "deps"
      # 编辑器/IDE配置目录
      - ".idea"
      - ".vscode"
      - ".eclipse"
      - ".netbeans"
      - ".sublime"
      # 系统/工具目录
      - "__pycache__"
  java:
    description: "常见Java文件清理文档"
    stored:
      - java
      - class
      - jsp
      - jar
      - groovy
      - ini
      - prop
      - properties
      - xml
      - yml
      - yaml
      - jspx
      - html
      - ftl
    remove:
    rmdirs:
  php:
    description: "常见php文件清理文档"
    stored:
      - php
      - tpl
      - vue
    remove:
    rmdirs:
  dotnet:
    description: "常见dotnet文件清理文档"
    stored:
      - cs
      - vb
      - fs
      - aspx
      - ascx
      - asmx
      - svc
      - cshtml
      - vbhtml
      - config
      - json
      - xml
      - resx
      - sln
      - csproj
      - vbproj
      - razor
      - user
    remove:
    rmdirs:
  # 前端开发
  front:
    description: "常见web前端文件清理文档"
    stored:
      - html
      - htm
      - css
      - scss
      - less
      - js
      - ts
      - jsx
      - tsx
      - vue
      - svelte
      - astro
    remove:
    rmdirs:

  # Python
  python:
    description: "常见python文件清理文档"
    stored:
      - py
      - pyw
      - ipynb
      - yaml
      - yml
      - json
      - csv
    remove:
    rmdirs:

  # Go 语言
  go:
    description: "常见go文件清理文档"
    stored:
      - go
      - mod
      - sum
      - yaml
      - yml
      - json
    remove:
    rmdirs:

  # Node.js / 服务端JS
  node:
    description: "常见nodejs文件清理文档"
    stored:
      - js
      - ts
      - mjs
      - cjs
      - json
      - yaml
      - yml
      - html
      - vue
      - ejs
    remove:
    rmdirs:

  # C / C++
  cpp:
    description: "常见c/c++文件清理文档"
    stored:
      - c
      - cpp
      - cc
      - h
      - hpp
      - cmake
      - in
